version: 2

models:
  - name: fct_orders
    description: "The core fact table capturing all order events and transaction metrics."
    columns:
      - name: order_id
        description: "Primary key. Unique identifier for each order."
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: "Dimension table containing customer profiles and their derived lifetime metrics."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_lifetime_value
        description: "Derived metric tracking historical spending."
        tests:
          - not_null